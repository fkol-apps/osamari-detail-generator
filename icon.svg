<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ADG(建築詳細ジェネレーター)アプリアイコン:下に「ADG」ロゴ+
       上階スラブ・吊りボルト・PB天井・LGS壁・石貼り床・巾木の断面+天井高寸法(玉止め)+60°引出線 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3a5e"/>
      <stop offset="1" stop-color="#0a1625"/>
    </linearGradient>
    <radialGradient id="glow" cx=".45" cy=".5" r=".62">
      <stop offset="0" stop-color="#3d7cc0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3d7cc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf6e"/>
      <stop offset="1" stop-color="#f39a2a"/>
    </linearGradient>
    <!-- RC:45°の3本線1組 -->
    <pattern id="rc" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="34" height="34" fill="#eaf0f7"/>
      <line x1="0" y1="4" x2="34" y2="4" stroke="#24456b" stroke-width="2.4"/>
      <line x1="0" y1="9.5" x2="34" y2="9.5" stroke="#24456b" stroke-width="2.4"/>
      <line x1="0" y1="15" x2="34" y2="15" stroke="#24456b" stroke-width="2.4"/>
    </pattern>
    <!-- 石材:斜線と破線の交互 -->
    <pattern id="stone" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="url(#gold)"/>
      <line x1="0" y1="3" x2="16" y2="3" stroke="#8a4a05" stroke-width="1.8"/>
      <line x1="0" y1="11" x2="16" y2="11" stroke="#8a4a05" stroke-width="1.8" stroke-dasharray="5 3"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- 方眼 -->
    <g stroke="#ffffff" stroke-opacity=".055" stroke-width="2">
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
    </g>

    <g transform="translate(256 40) scale(.72) translate(-256 0)">
    <!-- 上階スラブ -->
    <rect x="66" y="54" width="380" height="48" fill="url(#rc)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <!-- 吊りボルト・野縁受 -->
    <g stroke="#9cc2ea" stroke-width="4" stroke-linecap="round">
      <line x1="120" y1="102" x2="120" y2="156"/>
      <line x1="330" y1="102" x2="330" y2="156"/>
      <line x1="414" y1="102" x2="414" y2="156"/>
    </g>
    <line x1="66" y1="158" x2="184" y2="158" stroke="#9cc2ea" stroke-width="3"/>
    <line x1="262" y1="158" x2="446" y2="158" stroke="#9cc2ea" stroke-width="3"/>
    <!-- 野縁 -->
    <g fill="#9cc2ea">
      <rect x="92" y="160" width="12" height="8"/><rect x="146" y="160" width="12" height="8"/>
      <rect x="290" y="160" width="12" height="8"/><rect x="350" y="160" width="12" height="8"/><rect x="410" y="160" width="12" height="8"/>
    </g>
    <!-- PB天井(2枚貼) -->
    <rect x="66" y="168" width="118" height="14" fill="#0d2135" stroke="#ffffff" stroke-width="4"/>
    <rect x="262" y="168" width="184" height="14" fill="#0d2135" stroke="#ffffff" stroke-width="4"/>
    <line x1="66" y1="175" x2="184" y2="175" stroke="#ffffff" stroke-width="2"/>
    <line x1="262" y1="175" x2="446" y2="175" stroke="#ffffff" stroke-width="2"/>

    <!-- RC床スラブ -->
    <rect x="66" y="352" width="380" height="84" fill="url(#rc)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <!-- 床仕上げ(石貼り) -->
    <rect x="66" y="324" width="118" height="28" fill="url(#stone)" stroke="#ffffff" stroke-width="5"/>
    <rect x="262" y="324" width="184" height="28" fill="url(#stone)" stroke="#ffffff" stroke-width="5"/>

    <!-- LGS壁(スラブ下まで):ボード+吸音材 -->
    <rect x="184" y="102" width="78" height="250" fill="#0d2135" stroke="#ffffff" stroke-width="6"/>
    <line x1="198" y1="102" x2="198" y2="352" stroke="#ffffff" stroke-width="3.5"/>
    <line x1="248" y1="102" x2="248" y2="352" stroke="#ffffff" stroke-width="3.5"/>
    <polyline points="198,112 248,150 198,188 248,226 198,264 248,302 198,340" fill="none" stroke="#7fb2e6" stroke-width="3" stroke-linejoin="round"/>
    <!-- 巾木 -->
    <rect x="168" y="288" width="16" height="36" fill="url(#gold)" stroke="#ffffff" stroke-width="4"/>
    <rect x="262" y="288" width="16" height="36" fill="url(#gold)" stroke="#ffffff" stroke-width="4"/>

    <!-- 天井高寸法(玉止め) -->
    <g stroke="#62e3b4" stroke-linecap="round">
      <line x1="96" y1="182" x2="96" y2="324" stroke-width="4"/>
      <line x1="82" y1="182" x2="110" y2="182" stroke-width="3"/>
      <line x1="82" y1="324" x2="110" y2="324" stroke-width="3"/>
    </g>
    <circle cx="96" cy="182" r="7.5" fill="#62e3b4"/>
    <circle cx="96" cy="324" r="7.5" fill="#62e3b4"/>

    <!-- 60°引出線+注記 -->
    <circle cx="272" cy="304" r="9" fill="#ffffff"/>
    <polyline points="272,304 316,228 338,228" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="350" y="217" width="82" height="22" rx="11" fill="url(#gold)"/>
    <rect x="350" y="196" width="60" height="12" rx="6" fill="#ffffff" fill-opacity=".5"/>
    <rect x="350" y="248" width="46" height="12" rx="6" fill="#ffffff" fill-opacity=".5"/>
    </g>
    <rect x="96" y="372" width="320" height="6" rx="3" fill="url(#gold)"/>
    <text x="256" y="466" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="92" fill="#ffffff" letter-spacing="8">ADG</text>
  </g>
</svg>
